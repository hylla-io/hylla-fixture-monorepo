[project]
name = "ledger-api"
version = "0.1.0"
description = "Quotes for the monorepo fixture's ledger."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["ledger-core"]

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
ledger-core = { path = "../ledger-core", editable = true }

[tool.pyright]
include = ["ledger_api"]
pythonVersion = "3.12"
